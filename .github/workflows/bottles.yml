name: Build bottles
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bottle:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@f8d4222eb633e65c2a0157383cf80861fc7fae7f
        with:
          stable: true
      - name: Build, bottle, and test installation
        run: |
          brew tap rengwu/tap
          test Formula/slopchan.rb -ef "$(brew --repository rengwu/tap)/Formula/slopchan.rb"
          brew install --build-bottle rengwu/tap/slopchan
          version=$(brew info --json=v2 rengwu/tap/slopchan | python3 -c 'import json,sys; print(json.load(sys.stdin)["formulae"][0]["versions"]["stable"])')
          brew bottle --json --no-rebuild --root-url="https://github.com/rengwu/homebrew-tap/releases/download/slopchan-${version}" rengwu/tap/slopchan
          # Bottle before post_install so no generated posting token is shipped.
          brew uninstall slopchan
          brew install ./slopchan--*.bottle.tar.gz
          brew test rengwu/tap/slopchan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bottles-${{ matrix.os }}
          path: |
            *.bottle.tar.gz
            *.bottle.json
          if-no-files-found: error
