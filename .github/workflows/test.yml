name: Test formula
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@master
      - name: Register checkout as the tap
        run: brew tap --custom-remote rengwu/tap "$GITHUB_WORKSPACE"
      - name: Install and test
        run: |
          brew install --build-from-source rengwu/tap/slopchan
          brew test rengwu/tap/slopchan
